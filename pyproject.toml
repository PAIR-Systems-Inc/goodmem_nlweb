[project]
name = "nlweb-goodmem"
description = "GoodMem integration for NLWeb."
authors = [{ name = "GoodMem", email = "support@goodmem.ai" }]
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"
license-files = ["LICENSE"]
urls.homepage = "https://github.com/PAIR-Systems-Inc/goodmem_nlweb"
urls.source = "https://github.com/PAIR-Systems-Inc/goodmem_nlweb"
urls.issues = "https://github.com/PAIR-Systems-Inc/goodmem_nlweb/issues"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout",
    "build",
    "twine",
]
examples = [
    "openai>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = "-ra -q -r fEX"
timeout = 120
markers = [
    "integration: marks tests as integration tests that require external services",
]

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"
